<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashed ring cursor</title>
<style>
  /* ---------- demo page only (delete on your site) ---------- */
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #fff; font-family: system-ui, sans-serif;
    display: grid; place-items: center;
  }
  a { color: #fff; font-size: 1.4rem; }

  /* ================= CURSOR CSS (copy from here) ================= */

  /* Hides the system pointer. Only applied by JS once a mouse is detected. */
  .has-custom-cursor,
  .has-custom-cursor * { cursor: none !important; }

  /* Wrapper: JS moves this to the exact pointer position, no easing */
  #cursor {
    position: fixed; top: 0; left: 0; width: 0; height: 0;
    pointer-events: none; z-index: 2147483647; opacity: 0;
  }
  #cursor.visible { opacity: 1; }

  /* The ring: centred exactly on the pointer */
  #cursor .c {
    --s: 64px;                                /* ring size */
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s);
    translate: -50% -50%;
    box-sizing: border-box;
    border: 2px dashed #3ddc97;               /* dashed border colour */
    border-radius: 50%;
    background: rgba(60, 40, 40, .65);        /* dark translucent fill */
    animation: cursor-spin 12s linear infinite;
    transition: width .15s, height .15s, scale .1s, background-color .15s;
  }
  #cursor.hover .c { --s: 96px; background: rgba(61, 220, 151, .15); } /* over links/buttons */
  #cursor.down  .c { scale: .85; }                                     /* while clicking */

  @keyframes cursor-spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { #cursor .c { animation: none; } }
  @media (hover: none), (pointer: coarse) { #cursor { display: none; } }
  /* ================= CURSOR CSS (to here) ================= */
</style>
</head>
<body>

<a href="#">Hover this link</a>

<!-- ================= CURSOR HTML: put right before </body> ================= -->
<div id="cursor" aria-hidden="true"><div class="c"></div></div>

<!-- ================= CURSOR JS ================= -->
<script>
(() => {
  // Only run on devices with a real mouse
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  const cursor = document.getElementById('cursor');
  const root = document.documentElement;
  const interactive = 'a, button, input, select, textarea, label, [role="button"], [data-cursor]';

  addEventListener('mousemove', e => {
    // Exact position, no smoothing
    cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
    cursor.classList.add('visible');
    root.classList.add('has-custom-cursor');   // hide system pointer only after the ring is live
    cursor.classList.toggle('hover', !!e.target.closest(interactive));
  }, { passive: true });

  document.addEventListener('mouseleave', () => cursor.classList.remove('visible'));
  document.addEventListener('mouseenter', () => cursor.classList.add('visible'));
  addEventListener('mousedown', () => cursor.classList.add('down'));
  addEventListener('mouseup',   () => cursor.classList.remove('down'));
})();
</script>
</body>
</html>
