  <!-- Closing wave for the README, matching the banner's sea. -->
  <style>
    .w1 { animation: slide 15s linear infinite; }
    .w2 { animation: slide 10s linear infinite reverse; }
    .w3 { animation: slide 7s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1280px); } }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .w1, .w2, .w3, .tw { animation: none; } }
  </style>
