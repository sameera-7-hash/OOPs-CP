<svg xmlns="http://www.w3.org/2000/svg" width="860" height="70" viewBox="0 0 860 70" role="img" aria-label="Not sure who to see? Beacon points the way.; 41 conditions -> clear, safe next steps.; 3,438 doctors across 102 specialties.; Records: AES-256 + a SHA-256 hash chain.; Live now at beacon-oop.vercel.app">
  <!-- A typewriter line cycling through what Beacon does. Each line is
       revealed by a clip rect that steps forward one character at a time;
       textLength pins the text width so any monospace font lines up. -->
  <style>
    @keyframes k0 { 0.00% { opacity: 1; transform: translateX(0); } 10.00% { opacity: 1; transform: translateX(593.4px); } 17.20% { opacity: 1; transform: translateX(593.4px); } 19.60% { opacity: 1; transform: translateX(0); } 19.61%, 100% { opacity: 0; transform: translateX(0); } }
    .k0 { animation: k0 21.0s steps(43, end) infinite; }
    @keyframes k1 { 0%, 19.99% { opacity: 0; transform: translateX(0); } 20.00% { opacity: 1; transform: translateX(0); } 30.00% { opacity: 1; transform: translateX(552.0px); } 37.20% { opacity: 1; transform: translateX(552.0px); } 39.60% { opacity: 1; transform: translateX(0); } 39.61%, 100% { opacity: 0; transform: translateX(0); } }
    .k1 { animation: k1 21.0s steps(40, end) infinite; }
    @keyframes k2 { 0%, 39.99% { opacity: 0; transform: translateX(0); } 40.00% { opacity: 1; transform: translateX(0); } 50.00% { opacity: 1; transform: translateX(510.6px); } 57.20% { opacity: 1; transform: translateX(510.6px); } 59.60% { opacity: 1; transform: translateX(0); } 59.61%, 100% { opacity: 0; transform: translateX(0); } }
    .k2 { animation: k2 21.0s steps(37, end) infinite; }
    @keyframes k3 { 0%, 59.99% { opacity: 0; transform: translateX(0); } 60.00% { opacity: 1; transform: translateX(0); } 70.00% { opacity: 1; transform: translateX(552.0px); } 77.20% { opacity: 1; transform: translateX(552.0px); } 79.60% { opacity: 1; transform: translateX(0); } 79.61%, 100% { opacity: 0; transform: translateX(0); } }
    .k3 { animation: k3 21.0s steps(40, end) infinite; }
    @keyframes k4 { 0%, 79.99% { opacity: 0; transform: translateX(0); } 80.00% { opacity: 1; transform: translateX(0); } 90.00% { opacity: 1; transform: translateX(455.4px); } 97.20% { opacity: 1; transform: translateX(455.4px); } 99.60% { opacity: 1; transform: translateX(0); } 99.61%, 100% { opacity: 0; transform: translateX(0); } }
    .k4 { animation: k4 21.0s steps(33, end) infinite; }
    @media (prefers-reduced-motion: reduce) { .k0, .k1, .k2, .k3, .k4 { animation: none; } .k0 { transform: translateX(593.4px); } }
